# Draws the Activity card and the contribution snake (light + dark) daily and
# publishes them to the `output` branch, which the README links to.
name: Profile

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Before the snake: its container creates dist/ as root, which this step can't write into
      - name: Draw the Activity card (light + dark)
        run: python scripts/stats.py ${{ github.repository_owner }} dist
        env:
          # A personal access token sees private-repo contributions, so the totals
          # match the profile; the Actions token alone undercounts them
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      # Same greys as the Activity heatmap; the busiest days are lime
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#c6ff3d&color_dots=#161616,#333333,#6b6b6b,#bdbdbd,#c6ff3d
            dist/snake-light.svg?color_snake=#0a0a0a&color_dots=#efefef,#d4d4d4,#8a8a8a,#3a3a3a,#9fd420

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
